<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- Язык и заголовок перебивает i18n на старте: здесь значения по умолчанию,
         которые видны только пока грузится бандл. -->
    <title>Office: Company Tycoon</title>
    <!-- Пустая иконка вкладки: без неё браузер просит /favicon.ico, не находит
         и пишет 404 в консоль — а чистая консоль это отдельное требование
         площадки. Своя иконка игре не нужна: на площадке она берётся из
         Консоли, а игра живёт во фрейме. -->
    <link rel="icon" href="data:," />
    <!-- Праздничное оформление экрана загрузки: решается до первой отрисовки,
         иначе экран успел бы показаться обычным. См. public/boot-season.js. -->
    <script src="boot-season.js"></script>
    <!-- Стили загрузки живут здесь, а не в CSS бандла: экран обязан появиться
         до того, как бандл скачается, — иначе он опоздает ровно к тому
         моменту, ради которого нужен. -->
    <style>
      html, body { margin: 0; height: 100%; background: #14161c; overflow: hidden; }
      /* Safari на iPhone в альбоме сам раздувает длинный текст (лестница
         стадий отдела выходила вдвое крупнее подписей рядом). Размер шрифта
         задаёт игра — ползунком интерфейса. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* Safari на iPhone в альбоме сам укрупняет текст длинных блоков — лестница
         стадий отдела выходила вдвое крупнее подписей рядом. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

      /* Размер поля для вёрстки. Окна и подсказки жмутся к его краям, а не к
         краям окна браузера. Сегодня это одно и то же — поле занимает окно
         целиком, — но переменная остаётся: считать от края поля правильно и
         тогда, когда край совпал с краем окна, а места, где они разойдутся,
         известны наперёд (баннер площадки сверху, вырез телефона сбоку).
         Значения ставит fitToWindow(); до первого замера — всё окно.

         Пар две, и это не дубль. --field-px-* — само число в пикселях
         экрана, его пишет код. --field-w/h — то же число в единицах того,
         кто его читает: на телефоне интерфейс уменьшен через zoom, и внутри
         уменьшенной панели «343 пикселя экрана» — это 457 её собственных.
         Пересчёт делает mobile.css, переопределяя вторую пару у себя;
         вёрстка виджетов знает только про --field-w/h и остаётся честной в
         обоих случаях. */
      :root {
        --field-px-w: 100vw;
        --field-px-h: 100vh;
        --field-w: var(--field-px-w);
        --field-h: var(--field-px-h);
      }

      /* Игровое поле — весь экран. Пропорцию не режем: ограничение 2:1 стоило
         трети экрана на телефоне в альбоме и половины на широком мониторе, а
         игра рассчитана на любую — камера панорамируется, интерфейс жмётся к
         краям поля.

         Поле — это сам body, и не ради красоты: transform делает его
         системой отсчёта для position: fixed, а весь интерфейс у нас на
         fixed-оверлеях. Отсюда же и центрирование: обе строки держат
         вёрстку честной на случай, если поле снова окажется меньше окна.
         Размер ставит fitToWindow(), здесь значения до первого замера. */
      body {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 100vw;
        height: 100vh;
        transform: translate(-50%, -50%);
        overflow: hidden;
      }

      #game { width: 100%; height: 100%; }
      canvas { display: block; }

      /* Выделение и перетаскивание гасим на всём документе: протяжка мышью
         по офису не должна оставлять синюю подсветку на надписях интерфейса.
         Поля ввода — исключение, иначе в них нельзя было бы ничего выбрать.
         Событийные запреты живут в src/platform/desktop-input.ts; здесь то,
         что обязано действовать ещё до загрузки бандла. */
      body { user-select: none; -webkit-user-select: none; }
      input, textarea { user-select: auto; -webkit-user-select: auto; }
      canvas, img, svg { -webkit-user-drag: none; }
      #game { touch-action: none; -webkit-tap-highlight-color: transparent; }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 0 16px;
        background: radial-gradient(ellipse at 50% 42%, #1e2636 0%, #14161c 62%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 320ms ease;
      }

      /* Сетка пола, как в игре: ромбы 2:1. Гаснет к краям, чтобы не спорить
         с картинкой в центре. */
      #boot::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          repeating-linear-gradient(26.57deg, transparent 0 27px, #5ab7ff14 27px 28px),
          repeating-linear-gradient(-26.57deg, transparent 0 27px, #5ab7ff14 27px 28px);
        -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 0%, transparent 60%);
        mask-image: radial-gradient(ellipse at 50% 55%, #000 0%, transparent 60%);
      }

      /* Экран убирается классом, а не удалением узла: снимать его посреди
         перехода значило бы моргнуть чёрным. */
      #boot.is-done { opacity: 0; pointer-events: none; }

      /* Картинка без слов, а из слов до бандла — только название: оно одно
         на всех языках, остальное подождёт, пока игра узнает язык игрока. */
      #boot-scene { position: relative; display: flex; flex-direction: column; align-items: center; }
      #boot-mark { position: relative; z-index: 1; width: 132px; height: 132px; animation: boot-sway 3s ease-in-out infinite; }
      #boot-shadow {
        width: 92px;
        height: 14px;
        margin-top: -14px;
        border-radius: 50%;
        background: #0008;
        animation: boot-shadow 3s ease-in-out infinite;
      }

      /* Окна загораются по одному и гаснут: офис «просыпается», пока идёт
         загрузка. Задержка у каждого своя, в разметке. */
      #boot-mark .w { fill: #1b2230; animation: boot-lit 3.6s var(--d) ease-in-out infinite; }
      #boot-mark .w.warm { --lit: #ffd27a; }

      #boot-title {
        margin: -8px 0 0;
        text-align: center;
        font-size: 40px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 1px;
        color: #f2f5fa;
        text-shadow: 0 3px 0 #0f131b, 0 0 24px #5ab7ff40;
      }
      #boot-title span {
        display: block;
        margin-top: 6px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ffc53d;
        text-shadow: 0 2px 0 #0f131b;
      }

      #boot-bar {
        position: relative;
        width: 240px;
        max-width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #232a38;
        box-shadow: inset 0 2px 0 #0003, 0 0 0 2px #0f131b;
        overflow: hidden;
      }

      /* Полоса заполняется по стадиям запуска: до бандла она ползёт сама
         (бандл о себе ничего не сообщает), дальше каждую стадию двигает
         bootStage(). Внутри стадии полоса замедляется и до следующей отметки
         не доходит — так она не врёт, что всё почти готово.

         Двигается сдвигом, а не шириной, и не ради красоты: загрузка держит
         главный поток секундами, ширина на это время замирает, а сдвиг
         анимирует видеокарта. То же и у блика. */
      #boot-fill {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #2f8ed8, #6cc9ff);
        overflow: hidden;
        transform: translateX(-100%);
        animation: boot-creep 9s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      /* Блик поверх заполненной части: полоса выглядит живой и тогда, когда
         стадия затянулась и деления стоят. */
      #boot-fill::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(100deg, transparent, #fff6, transparent);
        animation: boot-run 1.4s linear infinite;
      }

      /* Подпись под полосой: какая из работ идёт сейчас. Нужна затем, что
         ожидания здесь разной природы — сеть, диск, видеокарта, — и молчащая
         полоса одинаково выглядит и в норме, и когда что-то застряло.

         Место под строку держится всегда: текст появляется позже полосы, и
         без запаса высоты она подпрыгнула бы на середине загрузки. Отрицательный
         отступ съедает общий зазор колонки — строка принадлежит полосе и
         должна стоять к ней ближе, чем логотип. */
      #boot-note {
        margin-top: -14px;
        min-height: 16px;
        font: 13px/16px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #7d879b;
        letter-spacing: 0.2px;
      }

      /* Совет по игре под стадией. Место держится так же, как у подписи, и
         на две строки: советы длиннее стадий. */
      #boot-tip {
        max-width: 320px;
        min-height: 36px;
        margin-top: -6px;
        text-align: center;
        font: 13px/18px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #a9b3c6;
        transition: opacity 240ms ease;
      }
      #boot-tip.is-hidden { opacity: 0; }

      @keyframes boot-creep { to { transform: translateX(-68%); } }

      /* Блик пробегает заполненную часть справа налево, к началу полосы. */
      @keyframes boot-run {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-250%); }
      }

      @keyframes boot-sway {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes boot-shadow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.85); opacity: 0.7; }
      }

      @keyframes boot-lit {
        0%, 100% { fill: #1b2230; }
        20%, 70% { fill: var(--lit, #6cc9ff); }
      }

      /* Хэллоуин: класс ставит public/boot-season.js, поправляет boot-screen.ts.
         Тыквы и мыши есть в разметке всегда и просто прячутся вне праздника. */
      #boot .pumpkin, #boot .bat { display: none; }
      .halloween #boot .pumpkin, .halloween #boot .bat { display: block; }
      .halloween #boot { background: radial-gradient(ellipse at 50% 42%, #2c1f3d 0%, #14161c 62%); }
      .halloween #boot::before {
        background:
          repeating-linear-gradient(26.57deg, transparent 0 27px, #b77dff14 27px 28px),
          repeating-linear-gradient(-26.57deg, transparent 0 27px, #b77dff14 27px 28px);
      }
      .halloween #boot-mark .w { --lit: #ff9a3c; }
      .halloween #boot-mark .w.warm { --lit: #ffd35a; }
      .halloween #boot-title { text-shadow: 0 3px 0 #0f131b, 0 0 24px #ff8a3c55; }
      .halloween #boot-title span { color: #ff9a3c; }
      .halloween #boot-fill { background: linear-gradient(90deg, #d5591a, #ffb45a); }
      .halloween #boot-mark .pumpkin__face { animation: boot-candle 1.3s ease-in-out infinite alternate; }

      .bat { position: absolute; width: 34px; height: 17px; overflow: visible; }
      .bat--one { top: 4px; left: -38px; animation: boot-bat-one 5s ease-in-out infinite; }
      .bat--two { top: 30px; right: -46px; width: 26px; height: 13px; animation: boot-bat-two 6.5s ease-in-out infinite; }
      .bat__wings { transform-origin: 12px 5px; animation: boot-flap 0.3s ease-in-out infinite alternate; }

      @keyframes boot-candle { to { fill: #ff9f2e; opacity: 0.75; } }
      @keyframes boot-flap { to { transform: scaleY(0.62); } }
      @keyframes boot-bat-one {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(22px, -10px); }
      }
      @keyframes boot-bat-two {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-18px, 12px); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-mark, #boot-shadow, #boot-fill::after, .bat, .bat__wings,
        .halloween #boot-mark .pumpkin__face { animation: none; }
        #boot-mark .w { animation: none; fill: var(--lit, #6cc9ff); }
      }
    </style>
